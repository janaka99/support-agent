name: support-agent-prod

services:
  api:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: support-agent-api-prod
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - RUN_MIGRATIONS=${RUN_MIGRATIONS:-true}
      - RUN_SEED=${RUN_SEED:-false}
    networks:
      - support-agent-prod-net

  worker:
    build:
      context: ../server
      dockerfile: Dockerfile.worker
    restart: always
    env_file:
      - ../.env
    environment:
      - PYTHONUNBUFFERED=1
    deploy:
      replicas: 2
    networks:
      - support-agent-prod-net

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: support-agent-web-prod
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ../.env
    networks:
      - support-agent-prod-net

networks:
  support-agent-prod-net:
    driver: bridge
