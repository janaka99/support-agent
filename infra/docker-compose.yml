name: support-agent

services:
  api:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: support-agent-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ../server:/app
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql://postgres:password@pgbouncer:6432/postgres
      - REDIS_URL=redis://:myredispassword@redis:6379/0
      - RUN_MIGRATIONS=true
      - RUN_SEED=true
    networks:
      - services-network

  worker:
    build:
      context: ../server
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    volumes:
      - ../server:/app
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql://postgres:password@pgbouncer:6432/postgres
      - REDIS_URL=redis://:myredispassword@redis:6379/0
      - PYTHONUNBUFFERED=1
    deploy:
      replicas: 2
    networks:
      - services-network

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: support-agent-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - api
    networks:
      - services-network

networks:
  services-network:
    external: true
