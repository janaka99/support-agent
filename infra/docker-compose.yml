version: "3.8"

services:
  api:
    build:
      context: ../server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../server:/app
    env_file:
      - ../.env
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ../web:/app
      - /app/node_modules # Prevents local node_modules from overwriting container's node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - api

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres_data:
