services:
  api:
    build:
      context: ../server
      dockerfile: Dockerfile
    command: sh -c "python -m alembic upgrade head && python -m scripts.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ../server:/app
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql://postgres:password@pgbouncer:6432/postgres
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - pgbouncer
      - redis

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ../web:/app
      - /app/node_modules # Prevents local node_modules from overwriting container's node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - api

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  worker:
    build:
      context: ../server
      dockerfile: Dockerfile
    command: sh -c "python -m app.worker.main"
    volumes:
      - ../server:/app
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql://postgres:password@pgbouncer:6432/postgres
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    depends_on:
      - pgbouncer
      - redis
      - api
    deploy:
      replicas: 4

  pgbouncer:
    image: edoburu/pgbouncer:latest
    ports:
      - "6432:6432"
    environment:
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=postgres
      - DB_HOST=postgres
      - LISTEN_PORT=6432
      - AUTH_TYPE=scram-sha-256
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=100
    depends_on:
      - postgres

  locust:
    image: locustio/locust
    ports:
      - "8089:8089"
    volumes:
      - ../server/scripts:/mnt/locust
    command: -f /mnt/locust/locustfile.py --host http://api:8000
    depends_on:
      - api

volumes:
  postgres_data:
